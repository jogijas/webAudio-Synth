<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebAudio Sequencer App</title>
    <style>
        /* Optional centering styles for your keyboard grid */
        #keyboard { display: flex; gap: 5px; margin-top: 20px; align-items: center; justify-content: center; }
        .key { padding: 20px; border: 1px solid #000; cursor: pointer; user-select: none; }
        .key.active { background-color: #ddd; }
    </style>
</head>
<body>
    <h1>WebAudio Sequencer</h1>

    <!-- Control Buttons -->
    <button id="startBtn">Play Sequencer</button>
    <button id="stopBtn">Stop Sequencer</button>

    <!-- Essential DOM nodes required by the audio engine -->
    <div id="keyboard"></div>
    <input type="range" id="masterGain" min="0" max="5" step="0.1" value="4" style="display:none;">

    <!-- Initialize your app logic -->
    <script type="module" src="./app.js"></script>
</body>
</html>
